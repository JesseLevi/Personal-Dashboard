name: CI Visual

# Split out of ci.yml (#259) so this job can carry its own `paths:` filter —
# a single workflow can only be skipped or run as a whole, not per job.
#
# PR-only (#259): a push to `main` re-ran the whole suite a second time on
# the merge commit even though squash-merge only happens after the PR run
# is already green, so `push: [main]` was ~50% wasted minutes. `main` never
# needs its own CI run as a result. `workflow_dispatch` is kept so this job
# can still be run by hand against a branch.
on:
  pull_request:
    # Only run when something that can move a screenshot baseline changed
    # (components, Ladle config, the visual tests themselves, tokens/theme
    # output, the Playwright config, or the lockfile/manifest that pins the
    # tool versions) — this is 33% of commits, the other 67% cannot affect
    # a rendered pixel.
    paths:
      - 'components/**'
      - '.ladle/**'
      - 'tests/visual/**'
      - 'app/theme.css'
      - 'design/tokens.json'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-visual.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Playwright + Ladle screenshot baselines (issue #6, ADR-0010).
  #
  # Runs inside the official Playwright Docker image, pinned to the exact
  # @playwright/test version in package.json, rather than plain
  # `ubuntu-latest` + `playwright install`: Playwright's own docs say
  # screenshot comparisons are only valid when captured in the SAME
  # browser+OS+font-rasterizer environment as the baseline, and recommend
  # running visual jobs in a container for exactly that reason. Bump the
  # image tag in lockstep whenever @playwright/test is upgraded.
  #
  # KNOWN GAP 1 (tolerance): none — `threshold` and `maxDiffPixels` are both
  # 0 in playwright.config.ts. See that file for why the Playwright default
  # (`threshold: 0.2`) silently blinds this gate to grey-on-grey token
  # regressions, which is this project's most common visual defect.
  #
  # KNOWN GAP 2 (platform, see ticket #6 report): the baselines committed in
  # tests/visual/**/*-darwin.png were captured on the (Docker-less) macOS dev
  # machine, not in this container, so this job's Linux run has no matching
  # `-linux.png` baselines yet and is expected to fail until those are
  # generated inside this same container image. `continue-on-error: true`
  # keeps that failure visible without blocking unrelated PRs in the
  # meantime — remove it once real Linux baselines are committed.
  # → tracked by #260, which makes this gate real (Linux baselines).
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TEMPORARY (#260): one-off generation pass. Reverted in the next commit
      # on this branch — do not merge this state. `continue-on-error` stays for
      # this pass only, so the run reaches the upload step below instead of
      # aborting on the "no baseline found" failures it is here to fix.
      - name: Ladle story screenshot baselines
        run: pnpm exec playwright test --update-snapshots
        continue-on-error: true
      - name: Upload generated Linux baselines (#260)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: tests/visual/ladle.visual.spec.ts-snapshots/**/*-linux.png
