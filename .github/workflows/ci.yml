name: CI

# Split off the `visual` and `db` jobs (#259) into their own workflow files
# (ci-visual.yml, ci-db.yml) so each can carry its own `paths:` filter — a
# single workflow can only be skipped or run as a whole, not per job.
#
# PR-only (#259): a push to `main` re-ran the whole suite a second time on
# the merge commit even though squash-merge only happens after the PR run
# is already green, so `push: [main]` was ~50% wasted minutes. `main` never
# needs its own CI run as a result. `workflow_dispatch` is kept so this job
# can still be run by hand against a branch.
on:
  pull_request:
    # Skip when only docs/markdown or design notes changed (33% of commits
    # are docs-only) — nothing in this job's steps (lint/typecheck/test/
    # tokens/gates) can be affected by those files.
    paths-ignore:
      - 'docs/**'
      - 'design/notes/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tokens in sync (generated theme matches tokens.json)
        run: |
          pnpm sync:tokens
          git diff --exit-code app/theme.css lib/ui/token-scales.generated.ts
      - name: Tokens match Figma export (name + value, #204-pending exempted) (#203)
        run: pnpm check:tokens-drift
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Security greps (ADR-0002/0003/0010)
        run: pnpm check:server-only
      - name: Raw radius/spacing utilities in components/ (flag or token, #218)
        run: pnpm check:raw-spacing
      - name: Retired token names anywhere in the repo, incl. .ladle/ + configs (#285)
        run: pnpm check:retired-tokens
      - name: Comment budget in components/ (one home per fact)
        run: pnpm check:comment-budget
      - name: Size budget for HANDOFF.md and guides (#295)
        run: pnpm check:doc-budget
      # `pnpm build` removed (#259): Vercel already builds a Preview on every
      # push and reports it as a commit status ("Vercel — success"), so
      # building again here duplicates that work on GitHub's metered
      # minutes. `pnpm typecheck` above remains the TypeScript gate.
