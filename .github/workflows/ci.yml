name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tokens in sync (generated theme matches tokens.json)
        run: |
          pnpm sync:tokens
          git diff --exit-code app/theme.css
      - name: Tokens match Figma export (name + value, #204-pending exempted) (#203)
        run: pnpm check:tokens-drift
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Security greps (ADR-0002/0003/0010)
        run: pnpm check:server-only
      - name: Comment budget in components/ (one home per fact)
        run: pnpm check:comment-budget
      - run: pnpm build

  # Playwright + Ladle screenshot baselines (issue #6, ADR-0010).
  #
  # Runs inside the official Playwright Docker image, pinned to the exact
  # @playwright/test version in package.json, rather than plain
  # `ubuntu-latest` + `playwright install`: Playwright's own docs say
  # screenshot comparisons are only valid when captured in the SAME
  # browser+OS+font-rasterizer environment as the baseline, and recommend
  # running visual jobs in a container for exactly that reason. Bump the
  # image tag in lockstep whenever @playwright/test is upgraded.
  #
  # KNOWN GAP 1 (tolerance): none — `threshold` and `maxDiffPixels` are both
  # 0 in playwright.config.ts. See that file for why the Playwright default
  # (`threshold: 0.2`) silently blinds this gate to grey-on-grey token
  # regressions, which is this project's most common visual defect.
  #
  # KNOWN GAP 2 (platform, see ticket #6 report): the baselines committed in
  # tests/visual/**/*-darwin.png were captured on the (Docker-less) macOS dev
  # machine, not in this container, so this job's Linux run has no matching
  # `-linux.png` baselines yet and is expected to fail until those are
  # generated inside this same container image. `continue-on-error: true`
  # keeps that failure visible without blocking unrelated PRs in the
  # meantime — remove it once real Linux baselines are committed.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ladle story screenshot baselines
        run: pnpm test:visual
        continue-on-error: true

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies migrations)
        run: supabase start
      - name: RLS test suite (pgTAP)
        run: supabase test db
      - name: RLS coverage gate (ADR-0009)
        run: bash scripts/check-rls-coverage.sh
      - name: Regenerate lib/database.types.ts (#190)
        run: pnpm db:types
      # Uploaded on every run, pass or fail, so a red diff below is
      # recoverable without Docker: `gh run download <run> -n database-types`
      # gives you the exact bytes to commit — never hand-edit the diff back
      # in, that just reintroduces drift on the next CLI/schema change.
      - name: Upload generated database.types.ts (#190)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: lib/database.types.ts
      - name: lib/database.types.ts matches the local schema, incl. reference (#190)
        run: git diff --exit-code lib/database.types.ts
      - run: supabase stop
        if: always()
