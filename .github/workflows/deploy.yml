name: Deploy (migrate + production)

# ADR-0012: Vercel + Supabase Cloud is the current deploy target. Vercel's own
# Git integration would otherwise deploy production the instant `main` moves,
# racing this workflow's migration step and reproducing the /recepten
# PGRST205 outage for the window in between. `vercel.json`'s `ignoreCommand`
# skips Vercel's own Git-triggered production build (VERCEL_ENV=production);
# this workflow's `deploy` job is the ONLY path to a production deployment,
# and it only runs after `migrate` succeeds. Preview deployments for PRs are
# untouched -- they go through Vercel's Git integration exactly as before.
#
# ACTIVATION ORDER: the six secrets below must exist BEFORE this file and
# `vercel.json` reach `main`. `vercel.json` disables Vercel's own production
# build on arrival, so if this workflow cannot authenticate, production has no
# deploy path at all — the live deployment keeps serving, but no later merge
# ever ships. See ADR-0012's first Consequences bullet.
#
# Hard rules, do not weaken:
#   - never add `supabase db reset`, `--force`, or any other destructive or
#     rewriting flag against the hosted project. `db push` only ever applies
#     pending migrations forward.
#   - never add `pull_request` to the trigger below. This job holds
#     production-schema and production-app credentials; it must only run
#     from `main` (post-merge) or an explicit manual dispatch.
#   - no `continue-on-error`, no output piped through a filter that could
#     mask a non-zero exit. A failed migration must fail the workflow and
#     block the deploy job below, not continue past it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to hosted Supabase
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply pending migrations (forward-only -- never db reset)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

  deploy:
    name: Deploy to Vercel production
    needs: migrate
    runs-on: ubuntu-latest
    environment: vercel-production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for production
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
