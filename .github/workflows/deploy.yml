name: Deploy (migrate + production)

# ADR-0012, amended 2026-08-02: Vercel + Supabase Cloud is the current deploy
# target, but production promotion is manual, by user decision -- this
# workflow no longer runs on every push to `main`. The user promotes a
# specific, already-built Vercel deployment to production themselves (Vercel
# dashboard or `vercel promote`) once they've confirmed it's good, instead of
# every merge going live automatically. `vercel.json`'s `"github": {
# "autoAlias": false }` still stops Vercel's own Git-triggered build from
# being auto-promoted/aliased to production either way, so nothing reaches
# production without a deliberate action.
#
# This workflow is now an on-demand tool: `workflow_dispatch` only, run by
# hand when the user wants CI to apply pending migrations and/or push a
# build to production together (e.g. to keep schema and app code landing in
# the same coordinated step, per ADR-0012 §3's original race-condition
# reasoning -- that reasoning still applies whenever this workflow's `deploy`
# job specifically is the thing promoting, it just no longer fires by itself).
#
# Hard rules, do not weaken:
#   - never add `supabase db reset`, `--force`, or any other destructive or
#     rewriting flag against the hosted project. `db push` only ever applies
#     pending migrations forward.
#   - never add a `push` or `pull_request` trigger back. This job holds
#     production-schema and production-app credentials; it must only run via
#     an explicit manual dispatch.
#   - no `continue-on-error`, no output piped through a filter that could
#     mask a non-zero exit. A failed migration must fail the workflow and
#     block the deploy job below, not continue past it.

# `target` (#280, ADR-0012 proposed amendment 2026-10-06) picks what a dispatch
# does: `migrate` applies migrations only and never touches Vercel, `deploy`
# promotes to production only, `both` (default) is the original behaviour. A
# FAILED migrate still blocks deploy; only a *skipped* migrate lets it run.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to run: migrate only, deploy only, or both (migrate first)"
        type: choice
        options:
          - both
          - migrate
          - deploy
        default: both

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to hosted Supabase
    if: ${{ inputs.target == 'migrate' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned, not `latest`, since 2026-08-07: CLI v2.112.0 (released that
      # morning, between this workflow's first green run and the next dispatch)
      # broke `supabase link` outright -- it validates the api-keys response's
      # `inserted_at` against a regex demanding a `Z` suffix, which the API
      # doesn't send, so link exits 1 with a SchemaError before `db push` is
      # ever reached (upstream supabase/cli#6115). `latest` means a routine
      # upstream release can break production migrations with no change on our
      # side, which is exactly what happened. Bump this deliberately once
      # #6115 is fixed and verified, rather than floating again.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0

      - name: Link the hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply pending migrations (forward-only -- never db reset)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

  deploy:
    name: Deploy to Vercel production
    needs: migrate
    # `!cancelled()` stops the implicit success() so a skipped migrate (target
    # `deploy`) doesn't skip this job; the result check keeps a failed migrate
    # blocking it.
    if: ${{ !cancelled() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (inputs.target == 'deploy' || inputs.target == 'both') }}
    runs-on: ubuntu-latest
    environment: vercel-production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm, per package.json#packageManager)
        run: corepack enable

      - name: Install Vercel CLI
        run: npm install -g vercel@63.1.2

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for production
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
