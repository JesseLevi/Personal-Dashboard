name: Visual Update

# Regenerates the Linux screenshot baselines inside the same container image
# the CI Visual gate uses, and commits them back to the dispatched branch.
# This is the ONLY way to produce baselines that count (no Docker locally).
#
# Usage:
#   gh workflow run visual-update.yml --ref <branch> [-f grep=<pattern>]
#
# `grep` scopes regeneration to matching test names (Playwright `-g`).
# A push made with GITHUB_TOKEN does not trigger other workflows, so
# afterwards start the gate by hand:
#   gh workflow run ci-visual.yml --ref <branch>
# Refuses to run on main.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only regenerate tests whose name matches (Playwright -g)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Refuse to run on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "Run this workflow on a feature branch, not main." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write Linux baselines
        env:
          GREP: ${{ inputs.grep }}
        run: |
          # Tests may report "failed" while snapshots are being written.
          if [ -n "$GREP" ]; then
            pnpm exec playwright test --update-snapshots -g "$GREP" || true
          else
            pnpm exec playwright test --update-snapshots || true
          fi
          count=$(find tests/visual -name '*-linux.png' | wc -l)
          echo "Found $count linux baselines"
          if [ "$count" -eq 0 ]; then
            echo "No -linux.png files were written." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-baselines
          path: tests/visual/**/*-linux.png
          retention-days: 7
      - name: Commit and push baselines
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit -m "chore(visual): Linux-baselines bijwerken via visual-update"
          git push origin "HEAD:$BRANCH"
