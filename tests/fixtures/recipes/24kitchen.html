<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Wat zijn de lekkerste pannenkoek-variaties?","acceptedAnswer":{"@type":"Answer","text":"Je zou denken dat pannenkoeken een Hollandse hap pur sang is, maar bijna elk land ter wereld kent een eigen variatie. Zo kom je 'm in Rusland tegen als blini’s, de Bánh xèo in Vietnam en in Frankrijk kennen ze de flinterdunne crêpe. In Amerika zijn ze juist weer fan van een wat dikke en luchtige variant."}},{"@type":"Question","name":"Hoe voorkom je dat je eerste pannenkoek mislukt?","acceptedAnswer":{"@type":"Answer","text":"Om te voorkomen dat de eerste pannenkoek mislukt, moet je de pan goed voorverwarmen. Check dit door een paar druppels water in de pan te gooien. Danst het water? Dan ben je klaar om te bakken. Zet wel meteen het vuur lager als je het beslag erin giet."}},{"@type":"Question","name":"Zoet beleg op een pannenkoek","acceptedAnswer":{"@type":"Answer","text":"Een ouderwetse pannenkoek beleg je met stroop, suiker, kaas of spek. Meer inspiratie voor zoet beleg? Probeer jam, poedersuiker, vers fruit (aardbeien, blauwe bessen of frambozen), banaan, gebakken appel en kaneel, chocoladepasta of pindakaas. "}},{"@type":"Question","name":"Hoeveel pannenkoeken per persoon?","acceptedAnswer":{"@type":"Answer","text":"Gemiddeld kun je rekenen op 3 tot 4 pannenkoeken per persoon als ze als hoofdgerecht dienen. Voor stevig belegde pannenkoeken óf als onderdeel van een uitgebreidere maaltijd kun je uitgaan van 1 tot 2 pannenkoeken per persoon."}},{"@type":"Question","name":"Hartig beleg op je pannenkoek","acceptedAnswer":{"@type":"Answer","text":"Zin in iets anders dan uitgebakken spek op je pannenkoek? Probeer hartig beleg op je pannenkoek als ham, kaas, gerookte zam, geitenkaas, salami of gebakken groenten uit de groentela als champignons en spinazie. "}},{"@type":"Question","name":"Wat is de verhouding voor pannenkoeken?","acceptedAnswer":{"@type":"Answer","text":"De klassieke verhouding voor pannenkoekenbeslag is, 500 ml melk, 250 gram bloem, 2-3 eieren en een snufje zout. Oftewel de volgende verhouding: 2 delen melk, 1 deel bloem en 0,5 deel eieren plus een beetje zout."}},{"@type":"Question","name":"Waarom eten mensen op 2 februari pannenkoeken?","acceptedAnswer":{"@type":"Answer","text":"Mensen eten op 2 februari pannenkoeken omdat het Lichtmis is. Dit is een oud feest dat het einde van de winter en daarmee het begin van de lichtere periode viert. De ronde, goudkleurige pannenkoeken lijken op de zon en brengen volgens de feestvierders geluk."}}]}</script>
