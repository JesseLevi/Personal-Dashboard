<script type="application/ld+json">[{"@context":"https://schema.org","@type":"WebPage","url":"https://www.jamieoliver.com/recipes/chicken/chicken-tikka-masala/","primaryImageOfPage":{"@type":"ImageObject","url":"https://asset.jamieoliver.com/images/cq7w2e71/production/7ac1a2406a986bcea99e8cc0bdb2fa72a29ac0e2-1387x2081.jpg/chickentikkareshot.webp?rect=0,521,1387,1040&w=1200&h=900&fm=webp&q=75&fit=crop&auto=format","width":1200,"height":900}},{"@context":"https://schema.org","@type":"Recipe","@id":"https://www.jamieoliver.com/recipes/chicken/chicken-tikka-masala/","mainEntityOfPage":"https://www.jamieoliver.com/recipes/chicken/chicken-tikka-masala/","image":[{"@type":"ImageObject","url":"https://asset.jamieoliver.com/images/cq7w2e71/production/7ac1a2406a986bcea99e8cc0bdb2fa72a29ac0e2-1387x2081.jpg/chickentikkareshot.webp?rect=0,348,1387,1387&w=1200&h=1200&fm=webp&q=75&fit=crop&auto=format","width":1200,"height":1200},{"@type":"ImageObject","url":"https://asset.jamieoliver.com/images/cq7w2e71/production/7ac1a2406a986bcea99e8cc0bdb2fa72a29ac0e2-1387x2081.jpg/chickentikkareshot.webp?rect=0,521,1387,1040&w=1200&h=900&fm=webp&q=75&fit=crop&auto=format","width":1200,"height":900},{"@type":"ImageObject","url":"https://asset.jamieoliver.com/images/cq7w2e71/production/7ac1a2406a986bcea99e8cc0bdb2fa72a29ac0e2-1387x2081.jpg/chickentikkareshot.webp?rect=0,651,1387,780&w=1280&h=720&fm=webp&q=75&fit=crop&auto=format","width":1280,"height":720}],"name":"Chicken tikka masala","description":"This brilliant Anglo-Indian chicken curry recipe is sure to make people very happy.","recipeYield":"4","totalTime":"PT90M","cookTime":"PT90M","recipeCuisine":"Indian","recipeCategory":"Chicken","recipeIngredient":["4 skinless free-range chicken breasts","2 onions","5cm piece of ginger","½ a bunch of fresh coriander","1 fresh red chilli","groundnut or vegetable oil","1 x 400g tin of plum tomatoes","½ x 400g tin of light coconut milk","1 small handful of flaked almonds","fat-free natural yoghurt","1 lemon","TIKKA MASALA PASTE","1-2 fresh red chillies","2 cloves of garlic","5cm piece of fresh ginger","1 teaspoon cumin seeds","1 teaspoon coriander seeds","1 teaspoon cayenne pepper","1 tablespoon smoked paprika","2 teaspoons garam masala","2 tablespoons groundnut oil","2 tablespoons tomato purée","1 bunch of fresh coriander","½ tablespoon desiccated coconut","2 tablespoons ground almonds"],"recipeInstructions":[{"@type":"HowToStep","text":"To make the curry paste, halve, deseed and roughly chop the chilli(es), then peel the garlic and ginger."},{"@type":"HowToStep","text":"Place a frying pan over a medium-high heat and scatter in the cumin and coriander seeds. Lightly toast for a few minutes, or until golden brown and smelling delicious, then remove from the heat."},{"@type":"HowToStep","text":"Add the toasted spices to a pestle and mortar and grind until fine, or whiz to a powder in a food processor."},{"@type":"HowToStep","text":"Once ground, add the toasted spices to a food processor along with the remaining paste ingredient and ½ teaspoon of sea salt, then whiz to a smooth paste. Put aside."},{"@type":"HowToStep","text":"Slice the chicken lengthways into 2cm strips."},{"@type":"HowToStep","text":"On a clean chopping board, peel, halve and finely slice the onions. Peel and finely slice the ginger, then pick the coriander leaves and put to one side, finely chopping the stalks along with the chilli."},{"@type":"HowToStep","text":"Heat 2 tablespoons of oil in a large casserole pan over a medium-high heat, add the onions, chilli, ginger and coriander stalks, then cook for around 10 minutes, or until softened and lightly golden."},{"@type":"HowToStep","text":"Add the chicken and 140g of the tikka masala paste, stirring well so everything is nicely coated. Season with salt and black pepper, add the tomatoes, breaking them up with the back of a spoon, and the coconut milk, then bring to the boil."},{"@type":"HowToStep","text":"Turn the heat down to medium-low, cover
